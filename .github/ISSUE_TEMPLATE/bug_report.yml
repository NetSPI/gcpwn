name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Include the module command you ran and any relevant flags.
        Use placeholder values for project IDs, resource names, and credentials.
      placeholder: |
        1. Run `modules/gcp/cloudrun/enumeration/enum_cloudrun_services`
        2. With flags: `--project <project-id>`
        3. See error / unexpected output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error
      description: Paste any error messages or unexpected output. Redact credentials and sensitive values.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Component / GCP service
      description: Which part of gcpwn does this affect?
      options:
        - App Engine
        - Artifact Registry
        - BigQuery
        - Bigtable
        - Cloud Batch
        - Cloud Build
        - Cloud Composer (Airflow)
        - Cloud Deploy
        - Cloud DNS
        - Cloud Functions
        - Cloud KMS
        - Cloud Logging
        - Cloud Run
        - Cloud Scheduler
        - Cloud Shell
        - Cloud Spanner
        - Cloud SQL
        - Cloud Storage
        - Cloud Tasks
        - Cloud TPU
        - Cloud Workflows
        - Compute Engine
        - Container Registry
        - Dataflow
        - Dataproc
        - Eventarc
        - Firestore
        - GKE
        - IAM
        - Org Policy
        - Managed Kafka
        - Memorystore (Redis)
        - Networking (VPC / DNS / Load Balancing)
        - Notebooks / Workbench
        - OpenGraph / Attack Paths
        - Pub/Sub
        - Secret Manager
        - Service Directory
        - Workspace (Google Workspace / DWD)
        - General / Framework / CLI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gcpwn version
      description: Run `gcpwn --version` or check `git log --oneline -1`
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
    validations:
      required: true
